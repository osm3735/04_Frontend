<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table tag</title>
    <style>
        /* CSS 블럭 */
        table {
            border-collapse: collapse;
            text-align : "center";
            
        }
    </style>
</head>
<body>
    <h1 align="center">이력서</h1>
    <br>
    <h2>■ 인적사항</h2>
    <table border="1" width="700" align="center">
        <tr align="center">
            <td rowspan="4" width="100">(사진)</td>
            <td bgcolor="#9aa5e4" rowspan="2" width="100">성명</td>
            <td bgcolor="#9aa5e4" width="100">한글</td>

        </tr>
        <tr align="center">
            <td bgcolor="#9aa5e4">영문</td>
            <td>30</td>
            <td bgcolor="#9aa5e4">전화</td>
            <td></td>
        </tr>
        <tr align="center">
            <td bgcolor="#9aa5e4">이메일</td>
            <td colspan="2">40</td>
            <td bgcolor="#9aa5e4">휴대폰</td>
            <td>010-222-222</td>
        </tr>
        <tr align="center">
            <td bgcolor="#9aa5e4">주소</td>
            <td colspan="4"></td>
        </tr>
        
    </table>
    <br> <br>
