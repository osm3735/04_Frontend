<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Tag</title>
    <style>
        .wrap{
            margin : 0 auto;
            width:80%;
        }
        header{height: 100px;}
        main{height: 500px;}
        footer{height: 100px;}
        div, header, main, footer{border:1px solid red}
    </style>
</head>
<body>
    <h1>Semantic 테그</h1>
    <div class="wrap">
        <header>해더 블럭</header>
        <main>메인 블럭</main>
        <footer>푸더 블럭</footer>

    </div>
</body>
</html>
