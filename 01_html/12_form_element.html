<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Tag</title>.
    <style>
        .wrap {
            margin: 0 auto;
            width: 70%;
        }
    </style>
    <script></script>
</head>

<body>
    <div class="wrap">
        <h1>Form Tag</h1>
        <!--  Client 와 server 통신할 때 사용하는 테그 
          - client의 데이터를 서버로 전송할 때 사용, 
          - 로그인, 회원가입시 input 처리.


            action : 서버에서 처리할 페이지
            method : client의 데이터를 서버로 전송하는 방식
                get : client 의 데이터를  URL 뒤에 넣어서 전송
                    255byte 까지만 전송, 보안 취약.
                post : http 해더 앞에서 데이터를 전송, url에 출력되지 않음, 보안 강하다.
                    무제한 데이터 전송 
            id : identity 식별자.
        -->


        <hr>

        <h2>회원가입 양식</h2>
        <br>
        <form action="submit.jsp" method="get">
            <table>
                <tr>
                    <td><label for="id">아이디 : </label></td>
                    <td><input type="text" name="id" id="id" placeholder="아이디 입력"> <br></td>
                </tr>
                <tr>
                    <td><label for="password">패스워드 : </label></td>
                    <td><input type="password" name="password" id="password"></td>
                </tr>
                <tr>
                    <td><label for="check_password">패스워드 확인 : </label></td>
                    <td><input type="password" name="check_password" id="check_password"></td>
                </tr>
                <tr>
                    <td><label for="email">이메일 : </label></td>
                    <td><input type="email" name="email" id="email"></td>
                </tr>
                <tr>
                    <td><label for="tel">전화번호 : </label></td>
                    <td><input type="tel" name="tel" id="tel"></td>
                </tr>
                <tr>
                    <td><label for="sex">성별 : </label></td>
                    <td>
                        <select id="sex">
                            <option value="man">남자</option>
                            <option value="woman">여자</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="sex2">성별2 : </label></td>
                    <td>
                        <input type="radio" id="sex2" name="sex2" value="man">남자
                        <input type="radio" name="sex2" value="woman">여자
                        <input type="radio" name="sex2" value="none">선택 없음
                    </td>
                </tr>
                <tr>
                    <td>취미 : </td>
                    <td>
                        <input type="checkbox" name="hobby1" value="sports">스포츠
                        <input type="checkbox" name="hobby2" value="music">음악
                        <input type="checkbox" name="hobby3" value="reading">독서
                        <input type="checkbox" name="hobby4" value="game">게임
                    </td>
                </tr>
                <tr>
                    <td><label for="date">생년월일 : </label></td>
                    <td><input type="date" name="date" id="date"></td>
                </tr>
                <tr>
                    <td><label for="profile">자기소개 : </label></td>
                    <td><textarea rows="30" name="profile" cols="40" placeholder="자기소개 적어줘." id="profile"></textarea></td>
                </tr>
                <tr align="center">
                    <td colspan="2"> <input type="reset" value="reeset"> &nbsp; <input type="submit" value="submit">
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>

</html>
