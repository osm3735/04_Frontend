<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Tag</title>
    <style>
        .wrap{
            margin :0 auto;
            width :80%;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Form Tag</h1>
        <!--  Client 와 server 통신할 때 사용하는 테그 
          - client의 데이터를 서버로 전송할 때 사용, 
          - 로그인, 회원가입시 input 처리.


            action : 서버에서 처리할 페이지
            method : client의 데이터를 서버로 전송하는 방식
                get : client 의 데이터를  URL 뒤에 넣어서 전송
                    255byte 까지만 전송, 보안 취약.
                post : http 해더 앞에서 데이터를 전송, url에 출력되지 않음, 보안 강하다.
                    무제한 데이터 전송 
        -->


        <hr>

        <h2>회원가입 양식</h2>
        <br>
        <form action="#" method="get">
            <table>
                <tr>
                    <td>아이디 : </td>
                    <td><input type="text" placeholder="아이디 입력"> <br></td>
                </tr>
                <tr>
                    <td>패스워드 : </td>
                    <td><input type="password"></td>
                </tr>
                <tr>
                    <td>이메일 : </td>
                    <td><input type="email"></td>
                </tr>
                <tr>
                    <td>전화번호 : </td>
                    <td><input type="tel"></td>
                </tr>
                <tr>
                    <td>성별 : </td>
                    <td>
                        <select>
                            <option value="man">남자</option>
                            <option value="woman">여자</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>생년월일 : </td>
                    <td><input type="date"></td>
                </tr>
                <tr>
                    <td>자기소개 : </td>
                    <td><textarea rows="30" cols="40" placeholder="자기소개 적어줘."></textarea></td>
                </tr>
            </table>
         </form>
    </div>
</body>
</html>
