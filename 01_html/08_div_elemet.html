<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <titl>Div Tag</title>
    <style>
        div {
            border : 1px solid black;
            color : red;
        }
        p { 
            border: 2px solid blue;
        }
        a { 
            border: 2px solid yellow;
        }
        span { 
            border: 2px solid green;
        }
    </style>
</head>
<body>
    <h1> Div 테그 - 공간을 분할하는 태그, 블락 테그 </h1>
    <!-- 블락 테그 -->
    <div>어제</div>
    <div>오늘</div>
    <div>내일</div>
    <br<br>

    <p>봄</p>
    <p>여름</p>
    <p>가을</p>
    <p>겨울</p>
    <br><br>

    <hr>
    <h1>span - 공간 분할 테그, 인라인 테그</h1>
    <span>어제1</span>
    <span>오늘1</span>
    <span>내일1</span>
    <br><br>

    <a href="#" target="_self">이순신</a>
    <a href="#" target="_self">강감찬</a>
    <a href="#" target="_self">세종대왕</a>
</body>
</html>
