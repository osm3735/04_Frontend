<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table tag</title>
    <style>
        /* CSS 블럭 */
        table {
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <h1 align="center">Table tag</h1>
    <br>
    <table border="1" align="center" width="700">
        <tr align="center" bgcolor="#9aa5e4">
            <td>이름</td>
            <td>나이</td>
            <td>주소</td>
            <td>핸드폰</td>
        </tr>
        <tr align="center">
            <td>홍길동</td>
            <td>30</td>
            <td>서울</td>
            <td>010-1111</td>
        </tr>
        <tr align="center">
            <td>이순신</td>
            <td>40</td>
            <td>부산</td>
            <td>010-222-222</td>
        </tr>
        
    </table>
</body>
</html>
