<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>div layout 구성</title>
    <style>
        .wrap{
            margin: 0 auto;
            width: 80%;
        }
        div{
            border :1px solid red;
        }
        .header{
            height: 100px;
        }
        .main{
            height: 500px;
        }
        .footer{
            height: 100px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header">해더 블럭</div>
        <div class="main">메인 블럭</div>
        <div class="footer">푸더 블럭</div>
    </div>
    <!-- div -> symentric tag 사용해 layout 짠다.-->
</body>
</html>
